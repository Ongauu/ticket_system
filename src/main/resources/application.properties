spring.application.name=auth


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS}
app.security.lock-duration-minutes=${LOCK_DURATION_MINUTES}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN}



logging.level.root=INFO
logging.level.com.crimson.auth=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}